<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.R. Prime Mart</title>
    <!-- Google Fonts থেকে Poppins ফন্ট যুক্ত করা হলো -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- হেডার সেকশন -->
    <header class="main-header">
        <div class="header-container">
            <div class="top-row">
                <div class="logo-area" onclick="showSection('shop-view')">
                    <img src="logo.jpg" alt="S.R. Prime Mart" class="logo-img" onerror="this.style.display='none'">
                    <span class="brand-name">S.R. Prime Mart</span>
                </div>
                <div class="header-right">
                    <div class="contact-info">
                        <small>LET'S TALK</small>
                        <span>01600445389</span>
                    </div>
                    
                    <!-- কার্ট আইকন ও ড্রপডাউন -->
                    <div class="cart-wrapper">
                        <div class="cart-icon-btn" onclick="toggleMiniCart()">
                            🛒 <span id="cartCount" class="cart-badge">0</span>
                        </div>

                        <div id="miniCart" class="mini-cart">
                            <div class="mini-cart-header">
                                <h4>Shopping Cart</h4>
                                <span class="close-mini" onclick="toggleMiniCart()">&times;</span>
                            </div>
                            <div id="miniCartItems" class="mini-cart-items">
                                <p class="empty-msg">আপনার কার্ট খালি আছে</p>
                            </div>
                            <div class="mini-cart-footer">
                                <div class="total-row">
                                    <span>Subtotal:</span>
                                    <span id="miniCartSubtotal">৳0</span>
                                </div>
                                <button class="view-cart-btn" onclick="goToCheckout()">View Cart & Checkout</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="search-area">
                <input type="text" id="searchInput" placeholder="Search products..." onkeyup="searchProducts()">
                <button class="search-btn" onclick="searchProducts()">Search</button>
            </div>
        </div>
    </header>

    <!-- নেভিগেশন বার -->
    <nav class="nav-bar">
        <div class="nav-container">
            <a href="javascript:void(0)" class="nav-link active" onclick="showSection('shop-view')">Home</a>
            <a href="javascript:void(0)" class="nav-link" onclick="showSection('shop-view')">All Products</a>
        </div>
    </nav>

    <!-- ১. প্রোডাক্ট গ্রিড পেজ -->
    <main id="shop-view" class="main-container">
        <section class="products-section">
            <h2 class="section-title">All Products</h2>
            <div id="product-container" class="product-grid"></div>
        </section>
    </main>

    <!-- ২. চেকআউট পেজ (নাম, ঠিকানা, ফোন নম্বর) -->
    <main id="checkout-view" class="main-container" style="display: none;">
        
        <div id="topSuccessNotice" class
