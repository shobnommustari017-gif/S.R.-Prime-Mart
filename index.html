<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SR Prime Mart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ওয়েবসাইট হেডার ও লোগো -->
    <header class="site-header">
        <div class="header-content">
            <img src="logo.jpg" alt="SR Prime Mart Logo" class="site-logo" onerror="this.style.display='none'">
            <h1>SR Prime Mart</h1>
        </div>
    </header>

    <main class="container">
        <!-- প্রোডাক্ট সেকশন (স্যাম্পল ছবির মতো ছোট গ্রিড কার্ড) -->
        <h2 class="section-title">আমাদের প্রোডাক্টসমূহ</h2>
        <div id="product-container" class="product-container"></div>

        <!-- কাস্টমার চেকআউট ও অর্ডার ফর্ম -->
        <section class="checkout-section">
            <h2>অর্ডার কনফার্ম করুন</h2>
            <form id="orderForm">
                <div class="form-group">
                    <label for="productSelect">পছন্দের প্রোডাক্ট নির্বাচন করুন:</label>
                    <select id="productSelect" name="Product" required>
                        <option value="">-- প্রোডাক্ট বেছে নিন --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="customerName">আপনার নাম:</label>
                    <input type="text" id="customerName" name="Name" placeholder="আপনার পুরো নাম লিখুন" required>
                </div>

                <div class="form-group">
                    <label for="customerPhone">ফোন নম্বর:</label>
                    <input type="tel" id="customerPhone" name="Phone" placeholder="০1XXXXXXXXX" required>
                </div>

                <div class="form-group">
                    <label for="customerAddress">সম্পূর্ণ ঠিকানা:</label>
                    <textarea id="customerAddress" name="Address" rows="3" placeholder="গ্রাম/রোড, থানা, জেলা" required></textarea>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">অর্ডার কনফার্ম করুন</button>
            </form>

            <!-- অর্ডার হওয়ার পর দেখানো মেসেজ -->
            <div id="successMessage" class="success-message" style="display: none;">
                ✅ আপনার অর্ডারটি সফলভাবে গ্রহণ করা হয়েছে! কিছুক্ষণের মধ্যে আমাদের টিম মেম্বার আপনাকে কল দিয়ে অর্ডারটি কনফার্ম করবে। অর্ডার করার জন্য আপনাকে ধন্যবাদ।
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
