<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SR Prime Mart</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome Icons for Search & Cart -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- টপ হেডার সেকশন -->
    <header class="main-header">
        <div class="header-container">
            <!-- লোগো ও ব্র্যান্ড নাম -->
            <div class="logo-area">
                <img src="logo.jpg" alt="SR Prime Mart" class="logo-img" onerror="this.style.display='none'">
                <span class="brand-name">SR Prime Mart</span>
            </div>

            <!-- সার্চ বার -->
            <div class="search-area">
                <input type="text" id="searchInput" placeholder="Search products..." onkeyup="searchProducts()">
                <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
            </div>

            <!-- ফোন নম্বর ও কার্ট আইকন -->
            <div class="header-right">
                <div class="contact-info">
                    <i class="fa-solid fa-phone"></i>
                    <div>
                        <small>LET'S TALK</small>
                        <span>01856575222</span>
                    </div>
                </div>
                <div class="cart-icon-btn" onclick="openCart()">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cartCount" class="cart-badge">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- নেভিগেশন বার (শুধু Home ও All Products) -->
    <nav class="nav-bar">
        <div class="nav-container">
            <a href="#" class="nav-link active">Home</a>
            <a href="#products-section" class="nav-link">All Products</a>
        </div>
    </nav>

    <!-- মেইন কনটেন্ট -->
    <main class="main-container">
        <!-- প্রোডাক্ট গ্রিড সেকশন -->
        <section id="products-section" class="products-section">
            <h2 class="section-title">All Products</h2>
            <div id="product-container" class="product-grid"></div>
        </section>
    </main>

    <!-- অর্ডার/কার্ট পপ-আপ মডাল (Popup Modal) -->
    <div id="cartModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCart()">&times;</span>
            <h2>অর্ডার কনফার্ম করুন</h2>
            
            <form id="orderForm">
                <div class="form-group">
                    <label>পছন্দের প্রোডাক্ট:</label>
                    <input type="text" id="selectedProduct" name="Product" readonly required style="background: #f0f0f0;">
                </div>

                <div class="form-group">
                    <label>আপনার নাম:</label>
                    <input type="text" id="customerName" name="Name" placeholder="আপনার পুরো নাম লিখুন" required>
                </div>

                <div class="form-group">
                    <label>ফোন নম্বর:</label>
                    <input type="tel" id="customerPhone" name="Phone" placeholder="০1XXXXXXXXX" required>
                </div>

                <div class="form-group">
                    <label>সম্পূর্ণ ঠিকানা:</label>
                    <textarea id="customerAddress" name="Address" rows="3" placeholder="গ্রাম/রোড, থানা, জেলা" required></textarea>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">অর্ডার কনফার্ম করুন</button>
            </form>

            <div id="successMessage" class="success-message" style="display: none;">
                ✅ আপনার অর্ডারটি সফলভাবে গ্রহণ করা হয়েছে! কিছুক্ষণের মধ্যে আমাদের টিম মেম্বার আপনাকে কল দিয়ে অর্ডারটি কনফার্ম করবে। ধন্যবাদ!
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
